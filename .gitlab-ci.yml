stages:
  - lint-check
  - run-install

lint-script:
  stage: lint-check
  image: koalaman/shellcheck-alpine
  variables:
    SHELLCHECK_OPTS: "-e SC2155"
  before_script:
    - shellcheck --version
  script:
    - shellcheck install.sh
    - shellcheck install_binary.sh
    - shellcheck install_dotfiles.sh
    - shellcheck vim/install_vim.sh
  only: &only_montior_files
    changes:
      - install.sh
      - install_binary.sh
      - install_dotfiles.sh
      - vim/install_vim.sh
      - .ci_test.sh
      - .gitlab-ci.yml

install-bionic: &install-bionic
  stage: run-install
  image: ubuntu:18.04
  script:
    - ./.ci_test.sh
  only:
    <<: *only_montior_files

install-focal:
  <<: *install-bionic
  image: ubuntu:20.04
