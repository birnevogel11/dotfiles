stages:
  - lint-check
  - run-install

.build_env: &build_env
  stage: run-install
  image: docker:19.03.2
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    COMPOSE_INTERACTIVE_NO_CLI: 1
  before_script:
    - apk add make
    - docker login -u ${DOCKER_REGISTRY_USERNAME} -p ${DOCKER_REGISTRY_PASSWORD}
  only:
    changes:
      - Dockerfile
      - Dockerfile.archlinux
      - Makefile
      - install.sh
      - install_binary.sh
      - install_dotfiles.sh

lint-script:
  stage: lint-check
  image: koalaman/shellcheck
  before_script:
    - shellcheck --version
  script:
    - shellcheck install.sh
    - shellcheck install_binary.sh
    - shellcheck install_dotfiles.sh
    - shellcheck vim/install_vim.sh
  only:
    changes:
      - install.sh
      - install_binary.sh
      - install_dotfiles.sh
      - vim/install_vim.sh
      - .ci_test.sh
      - .gitlab-ci.yml

install-bionic: &install-bionic
  stage: run-install
  image: ubuntu:18.04
  script:
    - ./.ci_test.sh
  only:
    changes:
      - Makefile
      - install.sh
      - install_binary.sh
      - install_dotfiles.sh
      - .ci_test.sh
      - .gitlab-ci.yml

install-focal:
  <<: *install-bionic
  image: ubuntu:20.04
