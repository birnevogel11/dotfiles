stages:
  - build-image

.build_env: &build_env
  stage: build-image
  image: docker:19.03.2
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    COMPOSE_INTERACTIVE_NO_CLI: 1
  before_script:
    - apk add make
    - docker login -u ${DOCKER_REGISTRY_USERNAME} -p ${DOCKER_REGISTRY_PASSWORD}
  only:
    changes:
      - Dockerfile
      - Dockerfile.archlinux
      - Makefile
      - install.sh
      - install_binary.sh
      - install_dotfiles.sh

install-dotfiles-bionic:
  stage: build-image
  image: ubuntu:18.04
  script:
    - ./.ci_test.sh
  only:
    changes:
      - Makefile
      - install.sh
      - install_binary.sh
      - install_dotfiles.sh
