# font_family  SauceCodePro Nerd Font
font_family Source Code Pro
font_size 22.0
adjust_line_height  0
adjust_column_width  0
disable_ligatures  never

# Nerd Fonts v3.3.0
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

tab_bar_style powerline

hide_window_decorations yes

cursor_shape block

foreground #abb2bf
background #272b33

color0 #272b33
color1 #ca8288
color2 #81ad61
color3 #dcc342
color4 #528bff
color5 #6972f3
color6 #56b6c2
color7 #abb2bf
color8 #31353f
color9 #f97782
color10 #aadb87
color11 #ffd589
color12 #68bbfe
color13 #dc85f7
color14 #60ccdb
color15 #bac2d4


map kitty_mod+right
map kitty_mod+left
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
