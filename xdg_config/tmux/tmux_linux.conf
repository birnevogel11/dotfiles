# True-color: {{{
# Enable true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# }}}
# Clipboard setting: {{{
set -s set-clipboard external
set -as terminal-features ',tmux-256color:clipboard'
#}}}
