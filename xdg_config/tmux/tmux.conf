# Prefix: {{{
# Set Ctrl-a as the default prefix key combination
set -g prefix C-a
bind-key C-a send-prefix

unbind C-b

unbind %
unbind '"'

# }}}
# General setting : {{{
# Allows for faster key repetition
set -s escape-time 0

set -g extended-keys on
set -g extended-keys-format csi-u

# enable vi keys.
set -g status-keys vi
set -g history-limit 10000

# vi key-binding
setw -g mode-keys vi

# Enable focus event for vim plugin
set -g focus-events on

# Auto window rename
set-window-option -g automatic-rename on

# Show the session name and the window title in iTerm corresponding tab and
# title
set-option -g set-titles on

# set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1

# Don't show `Activity in window N` message but do send a visual highlight bell
set-option -g visual-activity off
set-option -w -g monitor-activity on

# modes
setw -g clock-mode-colour colour137
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# panes
set -g pane-border-style 'fg=colour241'
set -g pane-active-border-style 'fg=colour4'
# }}}
# sesh: {{{
set -g detach-on-destroy off  # don't exit from tmux when closing a session
# set-hook -g session-created 'run-shell -b "sesh rename --enrich"'
bind -N "last-session (via sesh) " L run-shell "sesh last"

bind-key -n M-o run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""
# }}}
# Keybinding: {{{
# kill session
bind-key C-q kill-session

# New window with current path
bind-key c new-window -c '#{pane_current_path}'

# Split pane
bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'
bind-key y split-window -l 10 -v -c '#{pane_current_path}'
bind-key u split-window -l 25 -h -c '#{pane_current_path}'

# HJKL pane resize
bind-key j resize-pane -D 3
bind-key k resize-pane -U 3
bind-key h resize-pane -L 3
bind-key l resize-pane -R 3

# Function key to resize
# Although I don't like to map function key for shortcut, I don't have any
# better way to resolve the problem now.
bind-key -n F3 resize-pane -L 2
bind-key -n F4 resize-pane -D 2
bind-key -n F5 resize-pane -U 2
bind-key -n F6 resize-pane -R 2

# Shift arrow to switch windows
bind-key -n S-Left  previous-window
bind-key -n S-Right next-window

# Swap window
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Pane movement (merge and break)
bind-key C-b break-pane
bind-key m choose-window "join-pane -v -s "%%""  # horizontal merge

# reload config
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# }}}
# Smart pan switching: {{{
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
# bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
# bind-key -T copy-mode-vi C-\ select-pane -l
# }}}
# # plugins: {{{
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.tmux/plugins/tpm/tpm'
# #}}}
# Statusbar {{{
is_mac="uname | grep -q Darwin"

set -g status-position bottom
set -g status-style bg=colour235,fg=colour137,dim
set -g status-left ''
if-shell "$is_mac" 'set -g status-right " #[fg=colour232,bg=colour238] #(hostname -s) #[default]"' 'set -g status-right "#[fg=colour241]%H:%M #[default]#[fg=colour64,bg=colour235] #(tmux-mem-cpu-load -a0 -g0 --interval 2) #[default]#[fg=colour232,bg=colour238] #S - #(hostname -s) #[default]"'
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style fg=colour75,bg=colour237
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour248]#W#[fg=colour75]#F '

setw -g window-status-style fg=colour241,bg=colour235,none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour240]#W#[fg=colour235]#F '

setw -g window-status-bell-style fg=colour248,bg=colour1,bold
# }}}
# Platform-specific: {{{
# Load os specific config
is_mac="uname | grep -q Darwin"
if-shell "$is_mac" "source ~/usr/rc/xdg_config/tmux/tmux_mac.conf" "source ~/usr/rc/xdg_config/tmux/tmux_linux.conf"
# }}}
